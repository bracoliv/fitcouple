<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gym ASCII background sample</title>
<style>
  html, body { margin: 0; height: 100%; background: #fff6ec; }
  canvas { display: block; width: 100%; height: 100%; }
  .note {
    position: fixed;
    left: 50%;
    bottom: 14px;
    transform: translateX(-50%);
    margin: 0;
    padding: 8px 14px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.9);
    color: #6b3a4a;
    font: 600 13px/1.3 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    white-space: nowrap;
  }
</style>
</head>
<body>
<canvas id="bg" aria-label="Sample gym ASCII animation. Not on the live site."></canvas>
<p class="note">Sample only. Live site unchanged.</p>
<script>
(function () {
  var canvas = document.getElementById("bg");
  var ctx = canvas.getContext("2d");
  var coral = "#ff4d6d";
  var mango = "#ff8a00";
  var mint = "#12b5a0";
  var sky = "#2f9bff";
  var grape = "#a855f7";
  var pink = "#ff5fa2";
  var lemon = "#f5b400";
  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var start = performance.now();

  function resize() {
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(window.innerWidth * dpr);
    canvas.height = Math.round(window.innerHeight * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function paintLine(text, x, y, cw) {
    for (var i = 0; i < text.length; i++) {
      var ch = text.charAt(i);
      if (ch === " ") continue;
      if (ch === "o" || ch === "=") ctx.fillStyle = mango;
      else if (ch === "<" || ch === "3") ctx.fillStyle = pink;
      else if (ch === "*" || ch === "+") ctx.fillStyle = lemon;
      else ctx.fillStyle = coral;
      ctx.fillText(ch, x + i * cw, y);
    }
  }

  function heroFrame(t) {
    var cycle = t % 2.4;
    if (cycle < 0.7) {
      return [
        "             ",
        "    (^_^)    ",
        " o==o | o==o ",
        "     / \\     "
      ];
    }
    if (cycle < 1.35) {
      return [
        "o==o     o==o",
        "    (^_^)    ",
        "      | |    ",
        "     / \\     "
      ];
    }
    if (cycle < 1.9) {
      return [
        "o==o     o==o",
        "   \\(*^*)/   ",
        "      |      ",
        "     / \\     "
      ];
    }
    return [
      "  <3     <3  ",
      "   \\(^.^)/   ",
      "    / | \\    ",
      "   /     \\   "
    ];
  }

  function kettle(t) {
    var swing = Math.sin(t * 2.2);
    if (swing < -0.4) {
      return ["  __   ", " /   ) ", "(     )", " '---' "];
    }
    if (swing > 0.4) {
      return ["   __  ", " (   \\ ", "(     )", " '---' "];
    }
    return ["   |   ", "  ( )  ", "(     )", " '---' "];
  }

  function frame(now) {
    var w = window.innerWidth;
    var h = window.innerHeight;
    var t = reduce ? 1.5 : (now - start) / 1000;
    var size = w < 640 ? 16 : 22;
    ctx.font = "700 " + size + "px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace";
    ctx.textBaseline = "top";
    var cw = ctx.measureText("M").width;
    var ch = Math.round(size * 1.15);
    ctx.fillStyle = "#fff6ec";
    ctx.fillRect(0, 0, w, h);

    var cols = Math.ceil(w / cw) + 1;
    var rows = Math.ceil(h / ch) + 1;
    for (var r = 0; r < rows; r++) {
      for (var c = 0; c < cols; c++) {
        if ((c * 3 + r * 5) % 11 !== 0) continue;
        ctx.fillStyle = "rgba(255, 143, 171, 0.35)";
        ctx.fillText(".", c * cw, r * ch);
      }
    }

    var spark = ["*", "+", "<3", "*"];
    var sparkColor = [pink, lemon, grape, sky];
    for (var s = 0; s < 16; s++) {
      var sx = ((s * 149 + t * 26) % (w + 60)) - 30;
      var sy = h - ((s * 97 + t * 42) % (h + 40));
      ctx.globalAlpha = 0.55 + 0.45 * Math.abs(Math.sin(t * 2.2 + s));
      ctx.fillStyle = sparkColor[s % sparkColor.length];
      ctx.fillText(spark[s % spark.length], sx, sy);
    }
    ctx.globalAlpha = 1;

    var floorY = h * 0.78;
    ctx.fillStyle = sky;
    ctx.fillText("o========o", w / 2 - cw * 5, h * 0.12 + Math.sin(t * 2.1) * ch);

    if (w > 700) {
      var bell = kettle(t);
      bell.forEach(function (line, i) {
        ctx.fillStyle = grape;
        ctx.fillText(line, cw * 2, floorY - ch * (8 - i));
      });
      var buddyHop = Math.sin(t * 5) > 0 ? 0 : -ch * 0.45;
      var buddy = [" (o_o) ", "  /|\\  ", "  / \\  "];
      buddy.forEach(function (line, i) {
        ctx.fillStyle = sky;
        ctx.fillText(line, w - cw * 11, floorY - ch * (6.2 - i) + buddyHop);
      });
      var belt = ["=======", ">======", "=>=====", "==>====", "===>==="][Math.floor(t * 8) % 5];
      ctx.fillStyle = mint;
      ctx.fillText(belt, w - cw * 11, floorY - ch * 2.3);
      ctx.fillStyle = mango;
      ctx.fillText("[=====]", w - cw * 11, floorY - ch * 1.3);
    }

    var hero = heroFrame(t);
    var heroX = w / 2 - (hero[0].length * cw) / 2;
    var heroY = floorY - hero.length * ch - 4;
    hero.forEach(function (line, i) {
      paintLine(line, heroX, heroY + i * ch, cw);
    });

    for (var fx = 0; fx < cols; fx++) {
      ctx.fillStyle = (fx + Math.floor(t * 3)) % 6 === 0 ? lemon : mint;
      ctx.fillText(fx % 2 ? "=" : "-", fx * cw, floorY);
    }

    if (!reduce) requestAnimationFrame(frame);
  }

  window.addEventListener("resize", function () {
    resize();
    if (reduce) frame(start);
  });
  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
