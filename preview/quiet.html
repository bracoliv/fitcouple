<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fit · quiet preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --card: #181818;
    --raise: #1f1f1f;
    --line: #2c2c2c;
    --muted: #9b9b9b;
    --faint: #6e6e6e;
    --e: cubic-bezier(0.16, 1, 0.3, 1);
    --e2: cubic-bezier(0.33, 1, 0.68, 1);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #000; color: #fff; }
  body {
    font-family: Manrope, ui-sans-serif, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  body::before {
    content: "";
    position: fixed; inset: 0; pointer-events: none;
    background:
      radial-gradient(ellipse 42% 36% at 92% 8%, rgba(196, 154, 96, 0.22), transparent 62%),
      radial-gradient(ellipse 36% 42% at 100% 38%, rgba(48, 78, 130, 0.2), transparent 60%),
      #000;
  }
  main { position: relative; max-width: 430px; margin: 0 auto; padding: max(28px, env(safe-area-inset-top)) 20px 72px; }
  .nav, .kicker, h1, .sub, .ring-wrap, .card, .bond, .chart, .days, .note, .again {
    opacity: 0; filter: blur(4px); transform: translateY(16px);
  }
  .play .nav { animation: in .8s var(--e2) .05s forwards; }
  .play .kicker { animation: in .7s var(--e2) .25s forwards; }
  .play h1 { animation: in 1.05s var(--e) .4s forwards; }
  .play .sub { animation: in .7s var(--e2) .62s forwards; }
  .play .ring-wrap { animation: in .9s var(--e) .7s forwards; }
  .play .card:nth-child(1) { animation: card .9s var(--e) .95s forwards; }
  .play .bond { animation: in .7s var(--e2) 1.05s forwards; }
  .play .card:nth-child(3) { animation: card .9s var(--e) 1.15s forwards; }
  .play .chart { animation: in .8s var(--e2) 1.3s forwards; }
  .play .days { animation: in .7s var(--e2) 1.7s forwards; }
  .play .note, .play .again { animation: in .6s var(--e2) 1.9s forwards; }
  @keyframes in { to { opacity: 1; filter: blur(0); transform: none; } }
  @keyframes card {
    from { opacity: 0; filter: blur(6px); transform: translateY(24px) scale(0.985); }
    to { opacity: 1; filter: blur(0); transform: none; }
  }
  .nav {
    display: flex; align-items: center; gap: 4px; width: fit-content; margin: 0 auto 48px;
    padding: 6px 6px 6px 16px; background: rgba(20,20,20,.86); border: 1px solid var(--line);
    border-radius: 999px;
  }
  .brand { font-size: 13px; font-weight: 600; letter-spacing: .12em; }
  .nav a { color: var(--muted); text-decoration: none; font-size: 13px; padding: 8px 10px; }
  .pill { background: #fff; color: #000; border-radius: 999px; font: 600 13px Manrope, sans-serif; padding: 8px 14px; margin-left: 4px; }
  .kicker { margin: 0 0 8px; color: var(--faint); font-size: 13px; letter-spacing: .06em; }
  h1 { margin: 0; font-size: 88px; font-weight: 500; letter-spacing: -.05em; line-height: .9; font-variant-numeric: tabular-nums; }
  .sub { margin: 14px 0 0; color: var(--muted); font-size: 16px; min-height: 2.6em; }
  .sub b { color: #fff; font-weight: 500; }
  .hero { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; }
  .ring-wrap { position: relative; width: 112px; height: 112px; flex: none; }
  .ring-wrap svg { width: 112px; height: 112px; display: block; }
  .track { fill: none; stroke: #272727; stroke-width: 6; }
  .arc, .glint {
    fill: none; stroke: #fff; stroke-width: 6; stroke-linecap: round;
    transform: rotate(-90deg); transform-origin: 56px 56px;
  }
  .arc { stroke-dasharray: 289; stroke-dashoffset: 289; }
  .play .arc { animation: draw 1.15s cubic-bezier(.65,0,.35,1) 1s forwards; }
  @keyframes draw { to { stroke-dashoffset: 69; } }
  .glint { stroke-dasharray: 22 267; opacity: 0; }
  .play .glint { animation: glint 3.6s linear 2.2s infinite; }
  @keyframes glint { to { opacity: .85; transform: rotate(270deg); } }
  .pct { position: absolute; inset: 0; display: grid; place-items: center; font-size: 18px; font-weight: 500; font-variant-numeric: tabular-nums; }
  .people { margin-top: 36px; display: flex; flex-direction: column; gap: 12px; }
  .card {
    position: relative; overflow: hidden;
    background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 8px;
    transition: opacity .45s var(--e2), border-color .35s var(--e2), transform .45s var(--e);
  }
  .card.yield { opacity: .46; }
  .card.on { border-color: rgba(255,255,255,.72); }
  .card.answer { border-color: #fff; }
  .card.pressed { transform: scale(.975); }
  .pick {
    display: flex; justify-content: space-between; align-items: baseline; width: 100%;
    border: 0; background: transparent; color: inherit; font: 600 16px Manrope, sans-serif;
    padding: 12px; border-radius: 12px; cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  .pick .left { color: var(--muted); font-size: 14px; font-weight: 400; font-variant-numeric: tabular-nums; }
  .body { display: grid; grid-template-rows: 1fr; transition: grid-template-rows .5s var(--e); }
  .card.yield .body { grid-template-rows: 0fr; }
  .body > div { overflow: hidden; }
  .macro {
    position: relative; overflow: hidden; display: flex; justify-content: space-between; width: 100%;
    border: 0; background: transparent; color: inherit; font: 400 15px Manrope, sans-serif;
    padding: 12px; border-radius: 12px; cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  .macro .wash {
    position: absolute; inset: 0 auto 0 0; width: 100%; background: #272727;
    transform: scaleX(0); transform-origin: left; border-radius: 12px;
  }
  .play .wash { transition: transform 1.1s var(--e) 1.35s; }
  .macro span { position: relative; }
  .macro span:last-child { color: var(--muted); font-variant-numeric: tabular-nums; }
  .macro.on { background: var(--raise); }
  .sheen {
    position: absolute; top: 0; bottom: 0; width: 38%; pointer-events: none;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.28), transparent);
    transform: translateX(-140%);
  }
  .play .card:nth-child(1) .sheen { animation: sheen 3.4s ease-in-out 2.4s infinite; }
  @keyframes sheen { 0%, 55% { transform: translateX(-140%); } 100% { transform: translateX(320%); } }
  .tray { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .5s var(--e); }
  .tray.open { grid-template-rows: 1fr; }
  .tray > div { overflow: hidden; }
  .tray p { margin: 0; padding: 2px 12px 12px; color: var(--muted); font-size: 14px; opacity: 0; transform: translateY(6px); transition: .45s var(--e2); }
  .tray.open p { opacity: 1; transform: none; }
  .static { display: flex; justify-content: space-between; padding: 12px; font-size: 15px; }
  .static span:last-child { color: var(--muted); font-variant-numeric: tabular-nums; }
  .bond { background: #111; border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px 14px; }
  .rail-row { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px; }
  .rail-row button {
    border: 0; background: transparent; color: var(--muted); font: 500 13px Manrope, sans-serif;
    padding: 4px 0; cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  .rail-row button:first-child { text-align: left; }
  .rail-row button:last-child { text-align: right; }
  .rail-row button.hot { color: #fff; }
  .rail { position: relative; height: 2px; background: #2a2a2a; border-radius: 99px; }
  .knot {
    position: absolute; top: 50%; left: 54%; width: 10px; height: 10px; border-radius: 50%;
    background: #fff; transform: translate(-50%, -50%);
    transition: left .55s var(--e);
  }
  .reply { margin: 10px 0 0; min-height: 2.6em; color: var(--muted); font-size: 14px; line-height: 1.45; }
  .reply.bump { animation: bump .45s var(--e); }
  @keyframes bump { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .ripple {
    position: absolute; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%;
    border: 1px solid #fff; pointer-events: none; animation: rip .6s var(--e) forwards;
  }
  @keyframes rip { to { transform: scale(12); opacity: 0; } }
  .chart { margin-top: 28px; }
  .chart svg { width: 100%; height: auto; display: block; overflow: visible; }
  .line { fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; transition: stroke .45s var(--e2); }
  .line.husband { stroke: #fff; }
  .line.wife { stroke: #8d8d8d; }
  .chart[data-who="Wife"] .line.husband { stroke: #333; }
  .chart[data-who="Wife"] .line.wife { stroke: #fff; }
  .chart[data-who="both"] .line.wife { stroke: #cfcfcf; }
  .dot { fill: #fff; opacity: 0; }
  .days { margin-top: 8px; display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; }
  .days i { display: block; font-style: normal; color: var(--faint); font-size: 12px; }
  .days b { display: block; margin-top: 4px; font-weight: 500; font-size: 11px; font-variant-numeric: tabular-nums; transition: opacity .4s var(--e2); }
  .chart[data-who="Husband"] ~ .days .wn, .chart[data-who="Wife"] ~ .days .hn { opacity: .35; }
  .note { margin: 28px 0 0; color: var(--faint); font-size: 13px; line-height: 1.5; }
  .again {
    margin-top: 16px; background: transparent; color: #fff; border: 1px solid var(--line);
    border-radius: 999px; padding: 8px 14px; font: 500 13px Manrope, sans-serif;
  }
  @media (prefers-reduced-motion: reduce) {
    .nav, .kicker, h1, .sub, .ring-wrap, .card, .bond, .chart, .days, .note, .again,
    .arc, .glint, .wash, .sheen, .dot, .reply.bump, .ripple {
      animation: none !important; transition: none !important; opacity: 1; filter: none; transform: none;
    }
    .arc { stroke-dashoffset: 69; }
    .card.pressed { transform: none; }
  }
</style>
</head>
<body>
<main id="app">
  <nav class="nav">
    <span class="brand">FIT</span>
    <a href="#today">Today</a>
    <a href="#week">Week</a>
    <span class="pill">Today</span>
  </nav>
  <div class="hero" id="today">
    <div>
      <p class="kicker">Tuesday</p>
      <h1 id="hero">0</h1>
      <p class="sub" id="sub"><b id="who">Husband</b> · 600 kcal left of 2,500</p>
    </div>
    <div class="ring-wrap" aria-hidden="true">
      <svg viewBox="0 0 112 112">
        <circle class="track" cx="56" cy="56" r="46"></circle>
        <circle class="arc" cx="56" cy="56" r="46"></circle>
        <circle class="glint" cx="56" cy="56" r="46"></circle>
      </svg>
      <div class="pct" id="pct">76%</div>
    </div>
  </div>
  <div class="people" id="people"></div>
  <div class="chart" id="week" data-who="both">
    <svg viewBox="0 0 350 100" id="lines"></svg>
    <div class="days"></div>
  </div>
  <p class="note">Preview only. The live app is unchanged. Husband 2,500 and Wife 2,000 are common adult averages, not your goals. Tap a name: that person comes forward, the other answers.</p>
  <button class="again" type="button" id="again">Play again</button>
</main>
<script>
var people = [
  { name: "Husband", eaten: 1900, goal: 2500, prot: [82, 140], carbs: [180, 280], fat: [55, 70], food: "about 180 g chicken breast", week: [2100, 1980, 2400, 1860, 1900, 2200, 1750] },
  { name: "Wife", eaten: 1540, goal: 2000, prot: [70, 110], carbs: [150, 220], fat: [48, 65], food: "about 120 g chicken breast", week: [1680, 1820, 1500, 1900, 1540, 1700, 1600] }
];
var openProt = {};
var mode = "both";
var shown = "Husband";
var reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
var app = document.getElementById("app");
var C = 289;

function byName(n) { return people.filter(function (p) { return p.name === n; })[0]; }
function other(n) { return n === "Husband" ? byName("Wife") : byName("Husband"); }
function left(p) { return p.goal - p.eaten; }
function pct(p) { return p.eaten / p.goal; }

function card(p) {
  var protLeft = p.prot[1] - p.prot[0];
  return '<article class="card" data-person="' + p.name + '">'
    + '<button class="pick" type="button" data-person="' + p.name + '"><span>' + p.name + '</span><span class="left">' + left(p).toLocaleString() + ' left</span></button>'
    + '<div class="body"><div>'
    + '<button class="macro" type="button" data-prot="' + p.name + '"><i class="wash" data-p="' + (p.prot[0] / p.prot[1]) + '"></i><i class="sheen"></i><span>Protein</span><span>' + p.prot[0] + ' / ' + p.prot[1] + ' g</span></button>'
    + '<div class="tray"><div><p>' + protLeft + ' g left · ' + p.food + '</p></div></div>'
    + '<div class="static"><span>Carbs</span><span>' + p.carbs[0] + ' / ' + p.carbs[1] + ' g</span></div>'
    + '<div class="static"><span>Fat</span><span>' + p.fat[0] + ' / ' + p.fat[1] + ' g</span></div>'
    + '</div></div></article>';
}

function mount() {
  document.getElementById("people").innerHTML = card(people[0])
    + '<div class="bond"><div class="rail-row"><button type="button" data-person="Husband">Husband</button><div class="rail"><i class="knot" id="knot"></i></div><button type="button" data-person="Wife">Wife</button></div><p class="reply" id="reply"></p></div>'
    + card(people[1]);
  requestAnimationFrame(function () {
    document.querySelectorAll(".wash").forEach(function (el) {
      el.style.transform = "scaleX(" + el.getAttribute("data-p") + ")";
    });
  });
  apply(false);
}

function say(text) {
  var el = document.getElementById("reply");
  el.textContent = text;
  el.classList.remove("bump");
  void el.offsetWidth;
  el.classList.add("bump");
}

function apply(animate) {
  var one = mode !== "both";
  document.querySelectorAll(".card").forEach(function (el) {
    var name = el.getAttribute("data-person");
    el.classList.toggle("yield", one && name !== shown);
    el.classList.toggle("on", one && name === shown);
  });
  document.querySelectorAll(".rail-row button").forEach(function (b) {
    b.classList.toggle("hot", b.getAttribute("data-person") === shown && one);
  });
  document.querySelectorAll(".tray").forEach(function (t) {
    var name = t.parentNode.parentNode.parentNode.getAttribute("data-person");
    t.classList.toggle("open", !!openProt[name]);
    t.previousElementSibling.classList.toggle("on", !!openProt[name]);
  });
  var h = byName("Husband"), w = byName("Wife");
  var knot = (w.eaten / w.goal) >= (h.eaten / h.goal) ? 62 : 38;
  if (one) knot = shown === "Husband" ? 16 : 84;
  document.getElementById("knot").style.left = knot + "%";
  document.getElementById("week").setAttribute("data-who", one ? shown : "both");
  var lead = (pct(w) > pct(h)) ? "Wife is closer to her own goal." : "Husband is closer to his own goal.";
  var p = byName(shown);
  if (openProt[shown]) {
    say(shown + ", " + (p.prot[1] - p.prot[0]) + " g protein left, " + p.food + ". " + other(shown).name + " has " + (other(shown).prot[1] - other(shown).prot[0]) + " g left.");
  } else if (!one) {
    say(lead + " She has " + left(w) + " kcal left, he has " + left(h) + ".");
  } else {
    var o = other(shown);
    say("Showing " + shown + ". " + left(p) + " kcal left. " + o.name + " has " + left(o) + " left.");
  }
  document.getElementById("who").textContent = p.name;
  document.getElementById("sub").innerHTML = "<b>" + p.name + "</b> · " + left(p) + " kcal left of " + p.goal.toLocaleString() + ". " + other(shown).name + " has " + left(other(shown)) + ".";
  document.getElementById("pct").textContent = Math.round(pct(p) * 100) + "%";
  if (animate) roll(p.eaten);
  setRing(pct(p), animate);
  armDot();
}

function setRing(ratio, animate) {
  var arc = document.querySelector(".arc");
  var off = Math.round(C * (1 - ratio));
  if (!animate) return;
  arc.style.animation = "none";
  arc.style.transition = reduce ? "none" : "stroke-dashoffset .7s cubic-bezier(.16,1,.3,1)";
  arc.style.strokeDashoffset = off;
}

var rollId = 0;
function roll(to) {
  var hero = document.getElementById("hero");
  var from = Number(String(hero.textContent).replace(/,/g, "")) || 0;
  if (reduce) { hero.textContent = to.toLocaleString(); return; }
  var id = ++rollId;
  var start = performance.now();
  function tick(now) {
    if (id !== rollId) return;
    var t = Math.min(1, (now - start) / 700);
    var e = 1 - Math.pow(1 - t, 3);
    hero.textContent = Math.round(from + (to - from) * e).toLocaleString();
    if (t < 1) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

function pick(name, fromUser) {
  if (fromUser && mode === "one" && shown === name && !openProt[name]) mode = "both";
  else { mode = "one"; shown = name; }
  document.querySelectorAll(".card").forEach(function (el) {
    el.style.animation = "none";
    el.style.opacity = "";
    el.style.filter = "none";
    if (el.getAttribute("data-person") !== name) {
      el.classList.add("answer");
      setTimeout(function () { el.classList.remove("answer"); }, 650);
    }
  });
  apply(true);
}

function ripple(card, x, y) {
  if (reduce) return;
  var r = document.createElement("i");
  r.className = "ripple";
  var box = card.getBoundingClientRect();
  r.style.left = (x - box.left) + "px";
  r.style.top = (y - box.top) + "px";
  card.appendChild(r);
  r.addEventListener("animationend", function () { r.remove(); });
}

var peopleEl = document.getElementById("people");
peopleEl.addEventListener("pointerdown", function (e) {
  var card = e.target.closest(".card");
  if (card) card.classList.add("pressed");
});
peopleEl.addEventListener("pointerup", clearPress);
peopleEl.addEventListener("pointercancel", clearPress);
function clearPress() {
  document.querySelectorAll(".card.pressed").forEach(function (el) { el.classList.remove("pressed"); });
}
peopleEl.addEventListener("click", function (e) {
  var prot = e.target.closest("[data-prot]");
  if (prot) {
    var name = prot.getAttribute("data-prot");
    openProt[name] = !openProt[name];
    mode = "one";
    shown = name;
    var card = prot.closest(".card");
    ripple(card, e.clientX, e.clientY);
    document.querySelectorAll(".card").forEach(function (el) { el.style.animation = "none"; el.style.filter = "none"; });
    apply(true);
    return;
  }
  var btn = e.target.closest("[data-person]");
  if (!btn) return;
  var card = btn.closest(".card") || document.querySelector('.card[data-person="' + btn.getAttribute("data-person") + '"]');
  if (card && e.clientX) ripple(card, e.clientX, e.clientY);
  pick(btn.getAttribute("data-person"), true);
});

function pathOf(vals) {
  var xs = [8, 64, 119, 175, 231, 286, 342];
  return vals.map(function (k, i) {
    var y = 84 - (k - 1400) / 1200 * 68;
    return (i ? " L" : "M") + xs[i] + " " + y.toFixed(1);
  }).join("");
}
document.getElementById("lines").innerHTML = '<path class="line wife" d="' + pathOf(people[1].week) + '"></path><path class="line husband" d="' + pathOf(people[0].week) + '"></path><circle class="dot" r="3.5" cx="8" cy="48"></circle>';
var labels = ["M", "T", "W", "T", "F", "S", "S"];
document.querySelector(".days").innerHTML = labels.map(function (d, i) {
  return "<div><i>" + d + "</i><b class=\"hn\">" + people[0].week[i] + "</b><b class=\"wn\">" + people[1].week[i] + "</b></div>";
}).join("");

var run = 0;
var dotReady = false;
function armDot() {
  if (reduce) return;
  var id = ++run;
  var who = mode === "one" && shown === "Wife" ? ".wife" : ".husband";
  var path = document.querySelector(who);
  var dot = document.querySelector(".dot");
  var len = path.getTotalLength();
  if (!dotReady) {
    path.style.strokeDasharray = len;
    path.style.strokeDashoffset = len;
    path.animate([{ strokeDashoffset: len }, { strokeDashoffset: 0 }], { duration: 1400, delay: 200, easing: "cubic-bezier(.65,0,.35,1)", fill: "forwards" });
    dotReady = true;
  }
  var t0 = performance.now();
  function frame(now) {
    if (id !== run) return;
    var t = now - t0 - (dotReady ? 400 : 1800);
    if (t < 0) { requestAnimationFrame(frame); return; }
    var u = (t % 7000) / 7000;
    var pt = path.getPointAtLength(len * u);
    dot.setAttribute("cx", pt.x);
    dot.setAttribute("cy", pt.y);
    dot.style.opacity = "1";
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

function countIntro() {
  var hero = document.getElementById("hero");
  if (reduce) { hero.textContent = "1,900"; return; }
  var start = performance.now();
  function tick(now) {
    var t = Math.min(1, (now - start) / 1100);
    hero.textContent = Math.round(1900 * (1 - Math.pow(1 - t, 3))).toLocaleString();
    if (t < 1) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

function play() {
  mode = "both";
  shown = "Husband";
  openProt = {};
  dotReady = false;
  app.classList.remove("play");
  document.querySelectorAll(".card").forEach(function (el) { el.style.animation = ""; });
  var arc = document.querySelector(".arc");
  arc.style.animation = "";
  arc.style.transition = "none";
  arc.style.strokeDashoffset = "289";
  void app.offsetWidth;
  app.classList.add("play");
  mount();
  countIntro();
}

app.addEventListener("animationend", function (e) {
  if (!e.target.classList.contains("card")) return;
  e.target.style.animation = "none";
  e.target.style.filter = "none";
});

document.getElementById("again").addEventListener("click", play);
mount();
play();
</script>
</body>
</html>
