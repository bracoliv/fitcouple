name: gitleaks

on:
  push:
    branches: [v2]
  pull_request:
    branches: [v2]

jobs:
  scan:
    if: github.ref_name == 'v2' || github.base_ref == 'v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
